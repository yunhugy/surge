# ============================================================
# [Proxy Group] — 策略组重构
# 主选 → 按用途分流 → 按区域细分 → 自动测速
# ============================================================
[Proxy Group]
# 主代理选择（手动切换）
Proxy = select, Auto, US, IE, FR, MISC, DIRECT

# 自动测速（每10分钟，容忍100ms抖动）
Auto = url-test, MISC-01, MISC-02, MISC-03, MISC-04, US-05, IE-06, IE-07, FR-08, IE-09, US-10, US-11, IE-12, FR-13, IE-14, IE-15, IE-16, US-17, IE-18, IE-19, FR-20, US-21, FR-22, FR-23, US-24, FR-25, FR-26, IE-27, US-28, FR-29, IE-30, IE-31, US-32, FR-33, FR-34, US-35, FR-36, FR-37, FR-38, FR-39, IE-40, US-41, US-42, US-43, FR-44, FR-45, IE-46, IE-47, US-48, IE-49, FR-50, US-51, US-52, FR-53, US-54, US-55, IE-56, IE-57, US-58, url=http://www.gstatic.com/generate_204, interval=600, tolerance=100, timeout=5

# 按区域分组
US = select, US-05, US-10, US-11, US-17, US-21, US-24, US-28, US-32, US-35, US-41, US-42, US-43, US-48, US-51, US-52, US-54, US-55, US-58
IE = select, IE-06, IE-07, IE-09, IE-12, IE-14, IE-15, IE-16, IE-18, IE-19, IE-27, IE-30, IE-31, IE-40, IE-46, IE-47, IE-49, IE-56, IE-57
FR = select, FR-08, FR-13, FR-20, FR-22, FR-23, FR-25, FR-26, FR-29, FR-33, FR-34, FR-36, FR-37, FR-38, FR-39, FR-44, FR-45, FR-50, FR-53
MISC = select, MISC-01, MISC-02, MISC-03, MISC-04

# 流媒体（优先美国节点）
Streaming = select, US, IE, Auto, DIRECT

# AI 服务（ChatGPT/Claude 等，美国节点优先）
AI = select, US, IE, FR, Auto

